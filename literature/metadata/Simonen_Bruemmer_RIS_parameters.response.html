<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;  charset=UTF-8" />
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAM</title>
    <link rel="stylesheet" href="/digital/media/dam/dam.css">
    <script async defer src="/digital/media/altcha/altcha.min.js" type="module"></script>
</head>
<body>
    <div id="altcha-content">
        <h1><img src="/digital/media/assets/public/images/dl/favicons/favicon.ico"> digital.library.unt.edu</h1>
        <h2>Validating your request...</h2>
        <div>
            <form id="altcha-submission">
                <input type="hidden" name="csrfmiddlewaretoken" value="IZVgMRunE1zgh5ZKDRwosb0JvErMntwJ151GmdQFgtOXlAdFmRSmcGS1WeLD58YB">
                <altcha-widget id="altcha"></altcha-widget>
            </form>
        </div>
        
            <h3>This may take several seconds. Please do not refresh this page. If you are unable to reach our site content, please <a href="https://digital.library.unt.edu/feedback/?cat=Technical+Issue&user_feedback=Altcha+Challenge+Issue+Details%3A">let us know</a>.</h3>
        
    </div>
    <script type="text/javascript">
        window.addEventListener("load", () => {
            document.querySelector("#altcha").configure({
                challenge: {
                    algorithm: "SHA-256",
                    challenge: "e4061c127781ce697c4fa9b8f16f10d593f64204b422bf132dbe934f670e92b9",
                    salt: "46bec85ed4854615b1ccb831?expires=1789403866",
                    signature: "c6cf42c47181338de4a609354afbd958b3441df66ada98cf0b41a4a3ce5eaf33",
                    maxnumber: "500000",
                },
                auto: "none",
                debug: false,
                delay: 0,
                hidefooter: true,
                hidelogo: false,
            });
        });
        document.querySelector("altcha-widget").addEventListener("statechange", async (e) => {
            await e.detail;
            if (e.detail.state === "verified") {
                const challengeData = new FormData(document.forms["altcha-submission"]);
                try {
                   const response = await fetch("/dam/submit/", {
                        method: "POST",
                        body: challengeData,
                    });
                    const result = await response.json();
                    if ("success" in result) {
                        window.location.replace("/ark:/67531/metadc1272868/m2/1/high_res_d/10116224.pdf");
                    } else {
                        document.getElementById('altcha-content').innerHTML = `${result.error} This may take several seconds. Please do not refresh this page. If you are unable to reach our site content, please <a href="https://digital.library.unt.edu/feedback/?cat=Technical+Issue&user_feedback=Altcha+Challenge+Issue+Details%3A">let us know</a>.`;
                    }
                } catch (error) {
                    document.getElementById('altcha-content').innerHTML = `${error} This may take several seconds. Please do not refresh this page. If you are unable to reach our site content, please <a href="https://digital.library.unt.edu/feedback/?cat=Technical+Issue&user_feedback=Altcha+Challenge+Issue+Details%3A">let us know</a>.`;
                    console.error("Challenge submission error:", error);
                }
            }
        });
    </script>
</body>
</html>
